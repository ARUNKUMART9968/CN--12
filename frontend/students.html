<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse Students — CareerNexus</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .student-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 14px;
      cursor: pointer;
    }
    .student-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-accent);
      transform: translateY(-2px);
      background: var(--bg-card-hover);
    }
    .student-card-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }
    .student-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .student-meta span {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .student-card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }
    .filter-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 160px;
    }
    .filter-group label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }
    .filter-select {
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 0.85rem;
      font-family: var(--font-body);
      outline: none;
      transition: var(--transition);
      cursor: pointer;
    }
    .filter-select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }
    .filter-select option { background: var(--bg-card); }
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .results-count {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .looking-for-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(245,166,35,0.1);
      color: var(--gold);
      border: 1px solid rgba(245,166,35,0.2);
      border-radius: var(--radius-full);
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .no-linkedin {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,212,170,0.08);
      color: var(--teal);
      border: 1px solid rgba(0,212,170,0.2);
      border-radius: var(--radius-full);
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 28px;
    }
    .page-btn {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }
    .page-btn:hover { border-color: var(--accent); color: var(--accent); }
    .page-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
      box-shadow: var(--shadow-accent);
    }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .student-degree-badge {
      background: rgba(108,99,255,0.1);
      color: var(--accent-light);
      border: 1px solid rgba(108,99,255,0.2);
      border-radius: var(--radius-full);
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 600;
    }
    .goal-text {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    @media (max-width: 768px) {
      .filter-panel { flex-direction: column; }
      .filter-group { min-width: unset; width: 100%; }
    }
  </style>
</head>
<body>
<div class="app-wrapper">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Browse Students</h1>
        <p class="page-subtitle">Discover talented students looking for mentorship and opportunities</p>
      </div>
      <div class="flex" style="gap:10px;">
        <div class="search-bar" style="width:240px;">
          <svg style="width:16px;height:16px;color:var(--text-muted);flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search by name or skill..." />
        </div>
      </div>
    </div>

    <div class="content-area page-enter">

      <!-- FILTER PANEL -->
      <div class="filter-panel">
        <div class="filter-group">
          <label>Degree</label>
          <select class="filter-select" id="filterDegree">
            <option value="">All Degrees</option>
            <option>B.Tech</option>
            <option>B.E.</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>M.Tech</option>
            <option>MBA</option>
            <option>B.Sc</option>
            <option>M.Sc</option>
            <option>Ph.D</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Industry Interest</label>
          <select class="filter-select" id="filterIndustry">
            <option value="">All Industries</option>
            <option>Technology</option>
            <option>Finance</option>
            <option>Healthcare</option>
            <option>E-Commerce</option>
            <option>Education</option>
            <option>Consulting</option>
            <option>Media</option>
            <option>Manufacturing</option>
            <option>Government</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Looking For</label>
          <select class="filter-select" id="filterLooking">
            <option value="">Any Goal</option>
            <option value="Mentorship">Mentorship</option>
            <option value="Job Opportunity">Job Opportunity</option>
            <option value="Guidance">Guidance</option>
            <option value="Network">Network</option>
          </select>
        </div>
        <div class="filter-group">
          <label>Year</label>
          <select class="filter-select" id="filterYear">
            <option value="">All Years</option>
            <option value="1st">1st Year</option>
            <option value="2nd">2nd Year</option>
            <option value="3rd">3rd Year</option>
            <option value="4th">4th Year</option>
          </select>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="align-self:flex-end;">
          ✕ Clear Filters
        </button>
      </div>

      <!-- RESULTS HEADER -->
      <div class="results-header">
        <div class="results-count" id="resultsCount">Loading students...</div>
        <div class="flex" style="gap:8px;">
          <button class="btn btn-ghost btn-sm filter-btn active" onclick="setSort('name', this)">A–Z</button>
          <button class="btn btn-ghost btn-sm filter-btn" onclick="setSort('skills', this)">Most Skills</button>
          <button class="btn btn-ghost btn-sm filter-btn" onclick="setSort('recent', this)">Recent</button>
        </div>
      </div>

      <!-- STUDENT GRID -->
      <div class="grid-auto stagger" id="studentsGrid">
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
        <div class="skeleton" style="height:260px;border-radius:18px;"></div>
      </div>

      <!-- PAGINATION -->
      <div class="page-nav" id="pagination" style="display:none;"></div>

    </div>
  </main>
</div>

<!-- STUDENT DETAIL MODAL -->
<div class="modal-overlay" id="studentModal">
  <div class="modal" style="max-width:620px;">
    <div class="modal-header">
      <div>
        <h3 id="modalStudentName">Student Profile</h3>
        <p id="modalStudentSub" style="color:var(--text-secondary);font-size:0.875rem;margin-top:2px;"></p>
      </div>
      <button class="modal-close" data-modal-close="studentModal">✕</button>
    </div>
    <div id="modalStudentContent"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="nav.js"></script>
<script>
  Nav.init('students');
  const user = getUser();

  // Guard: only alumni can access this page
  if (user && user.role !== 'alumni') {
    window.location.href = 'dashboard.html';
  }

  let allStudents = [];
  let filtered = [];
  let currentPage = 1;
  const PER_PAGE = 12;
  let sortMode = 'name';

  // ============ LOAD STUDENTS ============
  async function loadStudents() {
    try {
      // Fetch up to 100 students (adjust limit as needed)
      const res = await api.getAllProfiles('student', 1, 100);
      allStudents = res.profiles || [];
      applyFiltersAndRender();
    } catch (e) {
      document.getElementById('studentsGrid').innerHTML = `
        <div style="grid-column:1/-1">
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <h3>Could not load students</h3>
            <p>${e.message || 'Check your server connection'}</p>
            <button class="btn btn-primary" onclick="loadStudents()">Retry</button>
          </div>
        </div>`;
      document.getElementById('resultsCount').textContent = 'Failed to load';
    }
  }

  // ============ FILTER & SORT ============
  function applyFiltersAndRender() {
    const search = document.getElementById('searchInput').value.toLowerCase().trim();
    const degree = document.getElementById('filterDegree').value;
    const industry = document.getElementById('filterIndustry').value;
    const looking = document.getElementById('filterLooking').value;
    const year = document.getElementById('filterYear').value;

    filtered = allStudents.filter(s => {
      if (degree && s.degree !== degree) return false;
      if (industry && s.preferredIndustry !== industry) return false;
      if (year && s.currentYear !== year) return false;
      if (looking && !(s.lookingFor || []).includes(looking)) return false;
      if (search) {
        const haystack = [
          s.name, s.university, s.degree, s.specialization,
          ...(s.skills || []), ...(s.interests || []),
          s.preferredIndustry, s.careerGoals
        ].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    // Sort
    filtered.sort((a, b) => {
      if (sortMode === 'name') return (a.name || '').localeCompare(b.name || '');
      if (sortMode === 'skills') return (b.skills?.length || 0) - (a.skills?.length || 0);
      if (sortMode === 'recent') return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
      return 0;
    });

    currentPage = 1;
    renderPage();
    renderPagination();
    document.getElementById('resultsCount').textContent =
      `${filtered.length} student${filtered.length !== 1 ? 's' : ''} found`;
  }

  function setSort(mode, btn) {
    sortMode = mode;
    document.querySelectorAll('.filter-btn').forEach(b => {
      b.className = 'btn btn-ghost btn-sm filter-btn';
    });
    btn.className = 'btn btn-secondary btn-sm filter-btn active';
    applyFiltersAndRender();
  }

  function clearFilters() {
    document.getElementById('filterDegree').value = '';
    document.getElementById('filterIndustry').value = '';
    document.getElementById('filterLooking').value = '';
    document.getElementById('filterYear').value = '';
    document.getElementById('searchInput').value = '';
    applyFiltersAndRender();
  }

  // ============ RENDER CARDS ============
  function renderPage() {
    const grid = document.getElementById('studentsGrid');
    const start = (currentPage - 1) * PER_PAGE;
    const pageStudents = filtered.slice(start, start + PER_PAGE);

    if (!pageStudents.length) {
      grid.innerHTML = `
        <div style="grid-column:1/-1">
          <div class="empty-state">
            <div class="empty-state-icon">🎓</div>
            <h3>${allStudents.length ? 'No students match your filters' : 'No students yet'}</h3>
            <p>${allStudents.length ? 'Try adjusting your search or filters' : 'Students will appear here once they register and complete their profiles'}</p>
            ${allStudents.length ? `<button class="btn btn-ghost" onclick="clearFilters()">Clear Filters</button>` : ''}
          </div>
        </div>`;
      return;
    }

    grid.innerHTML = pageStudents.map(s => studentCard(s)).join('');
  }

  function studentCard(s) {
    const skills = (s.skills || []).slice(0, 4);
    const lookingFor = (s.lookingFor || []).slice(0, 2);
    const hasLinkedIn = !!s.linkedinProfile;
    const hasGitHub = !!s.githubProfile;

    return `
      <div class="student-card" onclick="openStudentModal('${s.userId}')">
        <div class="student-card-header">
          <div class="avatar lg">${Helpers.initials(s.name || 'S')}</div>
          <div style="flex:1;min-width:0;">
            <div style="font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              ${s.name || 'Student'}
            </div>
            <div style="font-size:0.82rem;color:var(--text-secondary);margin-top:2px;">
              ${s.degree || '—'}${s.specialization ? ` · ${s.specialization}` : ''}
            </div>
            <div style="font-size:0.78rem;color:var(--text-muted);margin-top:2px;">
              🎓 ${s.university || '—'}
            </div>
          </div>
          ${s.currentYear ? `<span class="student-degree-badge">Year ${s.currentYear}</span>` : ''}
        </div>

        <div class="student-meta">
          ${s.preferredIndustry ? `<span>🏢 ${s.preferredIndustry}</span>` : ''}
          ${s.location ? `<span>📍 ${s.location}</span>` : ''}
          ${s.skills?.length ? `<span>🛠 ${s.skills.length} skills</span>` : ''}
        </div>

        ${s.careerGoals ? `<p class="goal-text">"${s.careerGoals}"</p>` : ''}

        ${skills.length ? `
          <div style="display:flex;flex-wrap:wrap;gap:5px;">
            ${skills.map(sk => `<span class="skill-badge" style="font-size:0.72rem;">${sk}</span>`).join('')}
            ${(s.skills || []).length > 4 ? `<span class="skill-badge" style="font-size:0.72rem;">+${s.skills.length - 4}</span>` : ''}
          </div>` : ''}

        ${lookingFor.length ? `
          <div style="display:flex;flex-wrap:wrap;gap:5px;">
            ${lookingFor.map(l => `<span class="looking-for-badge">Looking: ${l}</span>`).join('')}
          </div>` : ''}

        <div class="student-card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-primary btn-sm" style="flex:1;" onclick="sendConnectionToStudent('${s.userId}', this)">
            Connect
          </button>
          <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="startChatWithStudent('${s.userId}')">
            Message
          </button>
          ${hasLinkedIn ? `<a href="${s.linkedinProfile}" target="_blank" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()" title="LinkedIn">
            <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
          </a>` : ''}
          ${hasGitHub ? `<a href="${s.githubProfile}" target="_blank" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()" title="GitHub">
            <svg style="width:14px;height:14px" viewBox="0 0 24 24" fill="currentColor"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>
          </a>` : ''}
        </div>
      </div>`;
  }

  // ============ PAGINATION ============
  function renderPagination() {
    const totalPages = Math.ceil(filtered.length / PER_PAGE);
    const nav = document.getElementById('pagination');

    if (totalPages <= 1) {
      nav.style.display = 'none';
      return;
    }

    nav.style.display = 'flex';
    let html = `
      <button class="page-btn" onclick="goPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>
        ‹
      </button>`;

    for (let i = 1; i <= totalPages; i++) {
      if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
        html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
      } else if (i === currentPage - 2 || i === currentPage + 2) {
        html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
      }
    }

    html += `
      <button class="page-btn" onclick="goPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>
        ›
      </button>`;

    nav.innerHTML = html;
  }

  function goPage(p) {
    const totalPages = Math.ceil(filtered.length / PER_PAGE);
    if (p < 1 || p > totalPages) return;
    currentPage = p;
    renderPage();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ============ STUDENT MODAL ============
  async function openStudentModal(userId) {
    Modal.open('studentModal');
    const content = document.getElementById('modalStudentContent');
    content.innerHTML = `
      <div style="text-align:center;padding:48px;">
        <div style="width:36px;height:36px;border:2px solid var(--accent);border-top-color:transparent;border-radius:50%;animation:spin 0.6s linear infinite;margin:0 auto;"></div>
      </div>`;

    try {
      const res = await api.getStudentProfile(userId);
      const s = res.profile;
      document.getElementById('modalStudentName').textContent = s.name || 'Student';
      document.getElementById('modalStudentSub').textContent =
        `${s.degree || ''}${s.specialization ? ` in ${s.specialization}` : ''} · ${s.university || '—'}`;

      const lookingFor = s.lookingFor || [];
      const skills = s.skills || [];
      const interests = s.interests || [];

      content.innerHTML = `
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;">
          <div class="avatar lg">${Helpers.initials(s.name || 'S')}</div>
          <div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px;">
              ${s.currentYear ? `<span class="student-degree-badge">Year ${s.currentYear}</span>` : ''}
              ${s.preferredIndustry ? `<span class="badge badge-blue">${s.preferredIndustry}</span>` : ''}
              ${lookingFor.map(l => `<span class="looking-for-badge">${l}</span>`).join('')}
            </div>
            <div style="font-size:0.82rem;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:12px;">
              ${s.location ? `<span>📍 ${s.location}</span>` : ''}
              ${s.yearOfGraduation ? `<span>🎓 Graduating ${s.yearOfGraduation}</span>` : ''}
            </div>
          </div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;background:var(--bg-input);border-radius:10px;padding:16px;margin-bottom:18px;font-size:0.84rem;">
          <div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-bottom:2px;">University</div>
            <div style="font-weight:600;">🎓 ${s.university || '—'}</div>
          </div>
          <div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-bottom:2px;">Degree</div>
            <div style="font-weight:600;">📚 ${s.degree || '—'}</div>
          </div>
          <div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-bottom:2px;">Industry</div>
            <div style="font-weight:600;">🏢 ${s.preferredIndustry || 'Exploring'}</div>
          </div>
          <div>
            <div style="color:var(--text-muted);font-size:0.75rem;margin-bottom:2px;">Year</div>
            <div style="font-weight:600;">📅 ${s.currentYear ? `${s.currentYear} Year` : '—'}</div>
          </div>
        </div>

        ${s.careerGoals ? `
          <div class="profile-section" style="margin-bottom:16px;">
            <div class="profile-section-title">Career Goals</div>
            <p style="font-size:0.875rem;color:var(--text-secondary);line-height:1.7;">${s.careerGoals}</p>
          </div>` : ''}

        ${skills.length ? `
          <div class="profile-section" style="margin-bottom:16px;">
            <div class="profile-section-title">Skills</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${skills.map(sk => `<span class="skill-badge">${sk}</span>`).join('')}
            </div>
          </div>` : ''}

        ${interests.length ? `
          <div class="profile-section" style="margin-bottom:16px;">
            <div class="profile-section-title">Interests</div>
            <div style="display:flex;flex-wrap:wrap;gap:6px;">
              ${interests.map(i => `<span class="skill-badge">${i}</span>`).join('')}
            </div>
          </div>` : ''}

        ${s.projects?.length ? `
          <div class="profile-section" style="margin-bottom:16px;">
            <div class="profile-section-title">Projects</div>
            <div style="display:flex;flex-direction:column;gap:10px;">
              ${s.projects.slice(0, 3).map(p => `
                <div style="background:var(--bg-input);border-radius:8px;padding:12px;">
                  <div style="font-weight:600;font-size:0.875rem;margin-bottom:4px;">
                    ${p.link ? `<a href="${p.link}" target="_blank" style="color:var(--accent-light);">${p.title}</a>` : p.title}
                  </div>
                  ${p.description ? `<div style="font-size:0.8rem;color:var(--text-secondary);">${p.description}</div>` : ''}
                  ${p.technologies?.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">
                    ${p.technologies.map(t => `<span class="skill-badge" style="font-size:0.7rem;">${t}</span>`).join('')}
                  </div>` : ''}
                </div>`).join('')}
            </div>
          </div>` : ''}

        ${s.linkedinProfile || s.githubProfile ? `
          <div class="profile-section" style="margin-bottom:20px;">
            <div class="profile-section-title">Links</div>
            <div style="display:flex;flex-direction:column;gap:6px;">
              ${s.linkedinProfile ? `<a href="${s.linkedinProfile}" target="_blank" class="btn btn-ghost btn-sm" style="justify-content:flex-start;gap:8px;">🔗 LinkedIn Profile</a>` : ''}
              ${s.githubProfile ? `<a href="${s.githubProfile}" target="_blank" class="btn btn-ghost btn-sm" style="justify-content:flex-start;gap:8px;">💻 GitHub Profile</a>` : ''}
            </div>
          </div>` : ''}

        <div style="display:flex;gap:10px;">
          <button class="btn btn-primary flex-1" onclick="sendConnectionToStudent('${s.userId}', this)">
            🤝 Connect
          </button>
          <button class="btn btn-secondary flex-1" onclick="startChatWithStudent('${s.userId}')">
            💬 Message
          </button>
          ${s.linkedinProfile ? `<a href="${s.linkedinProfile}" target="_blank" class="btn btn-ghost">LinkedIn</a>` : ''}
        </div>`;

    } catch (e) {
      content.innerHTML = `
        <div class="empty-state" style="padding:32px;">
          <h3>Could not load profile</h3>
          <p>${e.message}</p>
        </div>`;
    }
  }

  // ============ ACTIONS ============
  async function sendConnectionToStudent(receiverId, btn) {
    if (btn) {
      btn.classList.add('btn-loading');
      btn.disabled = true;
    }
    try {
      await api.sendConnection(receiverId);
      Toast.success('Connection request sent!');
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.textContent = '✓ Sent';
        btn.disabled = true;
      }
      Nav.loadBadges();
    } catch (e) {
      Toast.error(e.message || 'Could not send request');
      if (btn) {
        btn.classList.remove('btn-loading');
        btn.disabled = false;
      }
    }
  }

  async function startChatWithStudent(receiverId) {
    try {
      const res = await api.startChat(receiverId);
      Modal.closeAll();
      window.location.href = `chat.html?chatId=${res.chat._id}`;
    } catch (e) {
      Toast.error(e.message || 'Could not start chat');
    }
  }

  // ============ EVENT LISTENERS ============
  document.getElementById('searchInput').addEventListener(
    'input',
    Helpers.debounce(applyFiltersAndRender, 300)
  );
  document.getElementById('filterDegree').addEventListener('change', applyFiltersAndRender);
  document.getElementById('filterIndustry').addEventListener('change', applyFiltersAndRender);
  document.getElementById('filterLooking').addEventListener('change', applyFiltersAndRender);
  document.getElementById('filterYear').addEventListener('change', applyFiltersAndRender);

  // ============ INIT ============
  loadStudents();
</script>
</body>
</html>
